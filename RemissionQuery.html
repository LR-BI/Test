<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workload queries: field lineage</title>
<style>
:root{--surface-1:#faf9f5;--surface-2:#ffffff;--bg-neutral:#f0eee6;--bg-accent:#e6f1fb;--bg-warning:#faeeda;
--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-accent:#185fa5;--text-warning:#854f0b;
--border:#e3e1d9;--border-strong:#c9c7bd;--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--surface-1:#1f1e1d;--surface-2:#2a2927;--bg-neutral:#353431;--bg-accent:#0c2f52;--bg-warning:#4a3208;
--text-primary:#ecebe6;--text-secondary:#b4b2a9;--text-accent:#85b7eb;--text-warning:#fac775;--border:#3d3c39;--border-strong:#55534f}}
body{margin:0;background:var(--surface-1);color:var(--text-primary);font-family:var(--font-sans)}
main{max-width:1000px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:22px;font-weight:500;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:0.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.tab:hover{background:var(--bg-neutral)}
.tab[aria-selected=true]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.intro{font-size:15px;line-height:1.6;color:var(--text-secondary);margin:0 0 20px;max-width:760px}
code{font-family:var(--font-mono);font-size:.92em}
.lw{position:relative;padding:4px 0 8px}
.pn{border:0.5px solid var(--border-strong);border-radius:12px;padding:12px 14px;margin-bottom:16px;min-height:118px;background:var(--surface-2)}
.pn h3{margin:0 0 4px;font-size:16px;font-weight:500}
.fx{font-family:var(--font-mono);font-size:12.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--bg-accent);color:var(--text-accent)}
.chip.fl{background:var(--bg-neutral);color:var(--text-secondary)}
.lb{font-size:12px;color:var(--text-secondary);margin-top:6px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;position:relative;z-index:1}
.co{display:flex;flex-direction:column;gap:10px}
.ct{font-size:13px;color:var(--text-secondary);margin-bottom:-2px}
.cd{border:0.5px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.hd{padding:6px 10px;font-size:13px;font-weight:500;background:var(--bg-neutral);word-break:break-all}
.f{padding:4px 10px;font-size:12.5px;font-family:var(--font-mono);cursor:pointer;border-top:0.5px solid var(--border);word-break:break-all}
.f:hover{background:var(--bg-neutral)}
.f.anc{background:var(--bg-accent);color:var(--text-accent)}
.f.flt{color:var(--text-accent);text-decoration:underline dotted}
.f.sel{background:var(--bg-warning);color:var(--text-warning);font-weight:500}
#ov{position:absolute;left:0;top:0;pointer-events:none;z-index:0;color:var(--text-accent)}
.lg{display:flex;flex-wrap:wrap;gap:18px;font-size:12.5px;color:var(--text-secondary);margin-bottom:10px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media (max-width:640px){.gr{gap:24px}.f{font-size:11px;padding:3px 6px}.hd{font-size:11.5px;padding:5px 6px}}
</style>
</head>
<body>
<main>
<h1>Workload queries: field lineage</h1>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" data-v="whole-college">Whole college</button>
  <button class="tab" role="tab" data-v="slot-detail">Slot detail (by area)</button>
</div>
<p class="intro" id="intro"></p>
<div class="lw" id="lw">
<div class="pn" id="pn"></div>
<div class="lg"><span><span class="sw" style="background:var(--bg-warning)"></span>Selected</span><span><span class="sw" style="background:var(--bg-accent)"></span>Value from</span><span style="text-decoration:underline dotted;color:var(--text-accent)">Filter / join</span></div>
<svg id="ov"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="eg"></g></svg>
<div class="gr" id="gr"></div>
</div>
</main>
<script>
/* ---------------- shared source tables ---------------- */
const SRC_BASE=[
['usa','ut_people_staff_area',0,['person_code','area','area2','session_code']],
['ou','organisation_units',0,['organisation_code','fes_full_name']],
['itc','ut_people_itrent_contract',0,['person_code','itr_contract_hours','contract_startdate','contract_enddate','contract_type','active_contract','session_code']],
['rmt','ut_people_staff_remission',0,['person_code','hrs','academicyear']],
['cat','ut_people_staff_cont_adj',0,['person_code','hours','academicyear']]];

/* ================= VIEW 1: whole college ================= */
const W={};
W.intro='How each output column of <code>FW_LG_LH_HR_Contact_WLoad_Prog</code> is built: one row per person, programme and contract, whole college. Click any field to see its formula and trace it back. Solid lines carry values. Dashed lines are filters and joins that decide which rows count.';
W.C=[
['people','people',0,['person_code','forename','surname','fes_staff_code']],
['red','register_event_details',0,['object_id','session_code','object_type','person_function']],
['reds','register_event_details_slots',0,['planned_start_date','planned_end_date','break','session_code']],
...SRC_BASE,
['sa','staff_area',1,['person_code','pam_area','pam_name','prog']],
['con','contract',1,['person_code','contract_start','weekly_hrs']],
['rem','remission',1,['person_code','hrs']],
['cadj','contract_adj',1,['person_code','hrs']],
['sl','slots',1,['staffname','progname','contact_hrs','workload_hrs']],
['st','staff_totals',1,['fte','contract_hrs','tt_contact_hrs','tt_workload_hrs']],
['out','Output',2,['Whole_College','pamarea','pamname','prog','progname','session_code','person_code','surname','staffname','constart','remission','contract_adjustment','contracthrs','fte','ttcontacthrs','ttworkloadhrs','tot','underover','contractlessremiss','cappedunderover']]];
(()=>{const SL=['reds.planned_start_date','reds.planned_end_date','reds.break','red.person_function'];
W.P={'sa.person_code':['usa.person_code'],'sa.pam_area':['usa.area'],'sa.prog':['usa.area2'],'sa.pam_name':['ou.fes_full_name'],
'con.person_code':['itc.person_code'],'con.weekly_hrs':['itc.itr_contract_hours'],'con.contract_start':['itc.contract_startdate'],
'rem.person_code':['rmt.person_code'],'rem.hrs':['rmt.hrs'],'cadj.person_code':['cat.person_code'],'cadj.hrs':['cat.hours'],
'sl.staffname':['people.forename','people.surname'],'sl.progname':['ou.fes_full_name','sa.prog'],'sl.contact_hrs':SL,'sl.workload_hrs':SL,
'st.fte':['con.weekly_hrs'],'st.contract_hrs':['con.weekly_hrs'],'st.tt_contact_hrs':['sl.contact_hrs'],'st.tt_workload_hrs':['sl.workload_hrs'],
'out.pamarea':['sa.pam_area'],'out.pamname':['sa.pam_name'],'out.prog':['sa.prog'],'out.progname':['sl.progname'],'out.session_code':['red.session_code'],
'out.person_code':['people.person_code'],'out.surname':['people.surname'],'out.staffname':['sl.staffname'],'out.constart':['con.contract_start'],
'out.remission':['rem.hrs'],'out.contract_adjustment':['cadj.hrs'],'out.contracthrs':['st.contract_hrs'],'out.fte':['st.fte'],
'out.ttcontacthrs':['st.tt_contact_hrs'],'out.ttworkloadhrs':['st.tt_workload_hrs'],
'out.tot':['st.tt_workload_hrs','rem.hrs','st.fte'],'out.underover':['st.tt_workload_hrs','rem.hrs','st.fte','st.contract_hrs'],
'out.contractlessremiss':['st.contract_hrs','rem.hrs','cadj.hrs'],'out.cappedunderover':['st.tt_workload_hrs','rem.hrs','cadj.hrs','st.fte','st.contract_hrs']};
const CF=['itc.contract_type','itc.active_contract','itc.contract_enddate','itc.session_code'];
const SF=['red.session_code','red.object_type','reds.session_code','people.fes_staff_code','sa.person_code','con.person_code'];
W.F={'sa.person_code':['usa.session_code'],'sa.pam_name':['ou.organisation_code'],'con.person_code':CF,'con.weekly_hrs':CF,
'rem.hrs':['rmt.academicyear'],'cadj.hrs':['cat.academicyear'],'sl.contact_hrs':SF,'sl.workload_hrs':SF,'sl.progname':['ou.organisation_code']};})();
W.D={
'out.Whole_College':"'Whole College' constant. Top-level group for SSRS.",
'out.pamarea':'staff_area.pam_area = ut_people_staff_area.area',
'out.pamname':'organisation_units.fes_full_name for the PAM area',
'out.prog':'staff_area.prog = ut_people_staff_area.area2',
'out.progname':'organisation_units.fes_full_name for the programme',
'out.session_code':'register_event_details.session_code (= @SESS)',
'out.person_code':'people.person_code','out.surname':'people.surname',
'out.staffname':"forename + ' ' + surname",
'out.constart':'Contract start date. One output row per contract.',
'out.remission':'ISNULL(remission.hrs, 0)',
'out.contract_adjustment':'ISNULL(contract_adj.hrs, 0)',
'out.contracthrs':'CAST(864 × weekly_hrs / 37 AS decimal(10,2))',
'out.fte':'CAST(weekly_hrs / 37 AS decimal(10,2))',
'out.ttcontacthrs':'SUM(slots.contact_hrs)',
'out.ttworkloadhrs':'SUM(slots.workload_hrs)',
'out.tot':'tt_workload_hrs + remission\n(remission NULL → 0 only when fte > 0)',
'out.underover':'tot − contract_hrs',
'out.contractlessremiss':'contract_hrs − ISNULL(remission,0) − ISNULL(contract_adj,0)',
'out.cappedunderover':'IF 0 < fte < 1 AND ROUND(MIN(pct,100)) = 100 → 0\nELSE workload + remission + adj − contract_hrs\npct = (workload + remission + adj) / contract_hrs × 100',
'st.fte':'ISNULL(weekly_hrs,0) / 37','st.contract_hrs':'864 × (ISNULL(weekly_hrs,0) / 37)   -- 864 = annual hrs at 1.0 FTE',
'st.tt_contact_hrs':'SUM(contact_hrs) per person','st.tt_workload_hrs':'SUM(workload_hrs) per person',
'sl.contact_hrs':'IF weighting = 0 → 0\nELSE (COUNT(*) × mins − break) / 60   -- int maths, rounds down',
'sl.workload_hrs':'(mins − break) × COUNT(*) × CAST(person_function AS float) / 60\nmins = DATEDIFF(mi, planned_start, planned_end)',
'sl.staffname':"people.forename + ' ' + people.surname",
'sl.progname':'organisation_units.fes_full_name joined on sa.prog',
'sa.person_code':'DISTINCT staff, session = @SESS. INNER JOIN to slots.',
'sa.pam_area':'ut_people_staff_area.area','sa.prog':'ut_people_staff_area.area2','sa.pam_name':'organisation_units.fes_full_name on area',
'con.person_code':'Active Lecturer / Management / VH Lecturer contracts. INNER JOIN: no contract = row dropped.',
'con.weekly_hrs':'CAST(itr_contract_hours AS decimal(10,2)). One row per contract.','con.contract_start':'CAST(contract_startdate AS date)',
'rem.hrs':'SUM(hrs) WHERE academicyear = @SESS','rem.person_code':'LEFT JOIN key',
'cadj.hrs':'SUM(TRY_CONVERT(int, hours))   -- decimals lost','cadj.person_code':'LEFT JOIN key',
'red.person_function':"Weighting code ('1', '0.5', '0'). Excludes LECT, INTERVIEW.",
'red.object_type':"Filter: = 'T'",'reds.session_code':'Filter: = @SESS','red.session_code':'Filter: = @SESS',
'people.fes_staff_code':'Filter: IS NOT NULL','itc.contract_type':"Filter: IN ('Lecturer','Management','VH Lecturer')",
'itc.active_contract':"Filter: = 'Y'",'itc.contract_enddate':'Filter: NULL or ≥ today','itc.session_code':'Filter: = @SESS',
'rmt.academicyear':'Filter: = @SESS','cat.academicyear':'Filter: = @SESS','usa.session_code':'Filter: = @SESS'};
W.def='out.cappedunderover';

/* ================= VIEW 2: slot detail ================= */
const S={};
S.intro='How each output column of the slot-detail query is built: one row per person and timetable slot, for one area (<code>@CL</code>). Step names match the tidied version (<code>op</code> → staff_area, <code>hr</code> → contract, <code>CADJ</code> → contract_adj). Click any field to trace it back. Solid lines carry values. Dashed lines are filters and joins.';
S.C=[
['people','people',0,['person_code','forename','surname','fes_staff_code']],
['red','register_event_details',0,['object_id','session_code','object_type','person_function']],
['reds','register_event_details_slots',0,['register_event_slot_id','register_event_id','planned_start_date','planned_end_date','break','session_code','object_type']],
['re','register_events',0,['id','description']],
['pf','person_functions',0,['function_code','long_description']],
...SRC_BASE,
['sa','staff_area',1,['person_code','pam_area','pam_name','prog']],
['con','contract',1,['person_code','weekly_hrs','contract_start','contract_type','contract_details']],
['rem','remission',1,['person_code','hrs']],
['cadj','contract_adj',1,['person_code','hrs']],
['sl','slots',1,['staffname','progname','starttime','endtime','day','startdate','enddate','slot_mins','weeks','is_cover','is_var','is_lect','var_weeks','cont_weeks']],
['out','Output',2,['prog','paname','pamarea','pamname','session_code','person_code','STAFFNAME','surname','starttime','endtime','day','day2','startdate','enddate','register_event_slot_id','sofar','sofarweeks','sofarmins','sofarweight','sofarhrs','brk','weeks','mins','weight','cover','variable','maincontract','description','register_event_id','contactwks','contactmins','conthrs','fte','hrs','remission','remissionissue','contract_adjustment','constart','contract_type','contract_details','colour','var_mins','var_weeks','cont_mins','cont_weeks']]];
(()=>{const ST='sl.startdate',PFN='red.person_function';
S.P={'sa.person_code':['usa.person_code'],'sa.pam_area':['usa.area'],'sa.prog':['usa.area2'],'sa.pam_name':['ou.fes_full_name'],
'con.person_code':['itc.person_code'],'con.weekly_hrs':['itc.itr_contract_hours'],'con.contract_start':['itc.contract_startdate'],
'con.contract_type':['itc.contract_type'],'con.contract_details':['itc.contract_type','itc.contract_startdate','itc.contract_enddate'],
'rem.person_code':['rmt.person_code'],'rem.hrs':['rmt.hrs'],'cadj.person_code':['cat.person_code'],'cadj.hrs':['cat.hours'],
'sl.staffname':['people.forename','people.surname'],'sl.progname':['ou.fes_full_name','sa.prog'],
'sl.starttime':['reds.planned_start_date'],'sl.endtime':['reds.planned_end_date'],'sl.day':['reds.planned_start_date'],
'sl.startdate':['reds.planned_start_date'],'sl.enddate':['reds.planned_end_date'],
'sl.slot_mins':['reds.planned_start_date','reds.planned_end_date','reds.break'],'sl.weeks':['reds.register_event_slot_id'],
'sl.is_cover':['pf.long_description'],'sl.is_var':['pf.long_description'],'sl.is_lect':['pf.long_description'],
'sl.var_weeks':['pf.long_description','reds.register_event_slot_id'],'sl.cont_weeks':['pf.long_description','reds.register_event_slot_id'],
'out.prog':['sa.prog'],'out.paname':['sl.progname'],'out.pamarea':['sa.pam_area'],'out.pamname':['sa.pam_name'],
'out.session_code':['red.session_code'],'out.person_code':['people.person_code'],'out.STAFFNAME':['sl.staffname'],'out.surname':['people.surname'],
'out.starttime':['sl.starttime'],'out.endtime':['sl.endtime'],'out.day':['sl.day'],'out.day2':['sl.day'],
'out.startdate':['sl.startdate'],'out.enddate':['sl.enddate'],'out.register_event_slot_id':['reds.register_event_slot_id'],
'out.sofar':[ST],'out.sofarweeks':[ST,'sl.weeks'],'out.sofarmins':[ST,'sl.slot_mins'],'out.sofarweight':[ST,PFN],
'out.sofarhrs':[ST,'sl.weeks','sl.slot_mins',PFN],
'out.brk':['reds.break'],'out.weeks':['sl.weeks'],'out.mins':['sl.slot_mins'],'out.weight':[PFN],
'out.cover':['sl.is_cover'],'out.variable':['sl.is_var'],'out.maincontract':['sl.is_lect'],
'out.description':['re.description'],'out.register_event_id':['reds.register_event_id'],
'out.contactwks':['sl.weeks',PFN],'out.contactmins':['sl.slot_mins',PFN],
'out.conthrs':['con.weekly_hrs'],'out.fte':['con.weekly_hrs'],'out.hrs':['con.weekly_hrs'],
'out.remission':['rem.hrs'],'out.remissionissue':['rem.hrs','con.weekly_hrs'],'out.contract_adjustment':['cadj.hrs'],
'out.constart':['con.contract_start'],'out.contract_type':['con.contract_type'],'out.contract_details':['con.contract_details'],
'out.colour':['con.weekly_hrs'],'out.var_mins':['sl.is_var','sl.slot_mins'],'out.var_weeks':['sl.var_weeks'],
'out.cont_mins':['sl.is_lect','sl.slot_mins'],'out.cont_weeks':['sl.cont_weeks']};
const CF=['itc.contract_type','itc.active_contract','itc.contract_enddate','itc.session_code'];
const CF2=['itc.active_contract','itc.contract_enddate','itc.session_code'];
const SF=['red.session_code','red.object_type','reds.session_code','reds.object_type','people.fes_staff_code',PFN,'sa.person_code'];
S.F={'sa.person_code':['usa.area','usa.session_code'],'sa.pam_name':['ou.organisation_code'],
'con.person_code':CF,'con.weekly_hrs':CF,'con.contract_start':CF,'con.contract_type':CF2,'con.contract_details':CF2,
'rem.hrs':['rmt.academicyear'],'cadj.hrs':['cat.academicyear'],'sl.progname':['ou.organisation_code'],
'sl.weeks':SF,'sl.slot_mins':SF,'sl.is_cover':['pf.function_code'],'sl.is_var':['pf.function_code'],'sl.is_lect':['pf.function_code'],
'out.description':['re.id']};})();
S.D={
'out.prog':'staff_area.prog = ut_people_staff_area.area2','out.paname':'Programme name: organisation_units.fes_full_name on prog',
'out.pamarea':'staff_area.pam_area (= @CL)','out.pamname':'organisation_units.fes_full_name for the PAM area',
'out.session_code':'register_event_details.session_code (= @SESS)','out.person_code':'people.person_code',
'out.STAFFNAME':"forename + ' ' + surname",'out.surname':'people.surname',
'out.starttime':'CONVERT(char(5), planned_start_date, 108)   -- hh:mm','out.endtime':'CONVERT(char(5), planned_end_date, 108)',
'out.day':'DATEPART(dw, planned_start_date)   -- depends on DATEFIRST','out.day2':'DATENAME(dw, planned_start_date)   -- e.g. Monday',
'out.startdate':'First date the slot runs (MIN, time removed)','out.enddate':'Last date the slot runs (MAX, time removed)',
'out.register_event_slot_id':'register_event_details_slots.register_event_slot_id. Grouping key (Tom Hughes Feb 2024).',
'out.sofar':'1 if slot first date < today, else NULL',
'out.sofarweeks':'IF started → weeks\n-- counts ALL weeks of the slot once week 1 has passed',
'out.sofarmins':'IF started → mins','out.sofarweight':'IF started → CAST(person_function AS decimal(7,2))',
'out.sofarhrs':'IF started → weeks × mins × weight\n-- result is MINUTES, not hours (no / 60)',
'out.brk':'register_event_details_slots.break (minutes)','out.weeks':'COUNT of weekly rows for this slot',
'out.mins':'DATEDIFF(mi, planned_start, planned_end) − break','out.weight':'CAST(person_function AS decimal(7,2))',
'out.cover':"'Y' if person_functions.long_description LIKE '%Cover%'",
'out.variable':"'Y' if long_description LIKE 'Var%'",'out.maincontract':"'Y' if long_description LIKE 'Lect%'",
'out.description':'register_events.description','out.register_event_id':'register_event_details_slots.register_event_id',
'out.contactwks':'IF person_function = 0 → 0 ELSE weeks','out.contactmins':'IF person_function = 0 → 0 ELSE mins',
'out.conthrs':'ISNULL(contract.weekly_hrs, 0)   -- summed over all contracts','out.fte':'weekly_hrs / 37',
'out.hrs':'864 × (weekly_hrs / 37)   -- annual contract hrs',
'out.remission':'remission.hrs (NULL if none)',
'out.remissionissue':'0 if remission = 1300\n1 if no contract hrs AND remission > 0\nelse 0',
'out.contract_adjustment':'contract_adj.hrs (decimal, NULL if none)',
'out.constart':'Earliest active contract start date',
'out.contract_type':"STRING_AGG(contract_type, ', ')\n-- every active contract, e.g. 'Lecturer, Technician'",
'out.contract_details':"STRING_AGG(type + ' (start - end)', '; ')\nend shows 'Ongoing' if NULL",
'out.colour':'0 if no contract hrs, else 1   -- SSRS row colour',
'out.var_mins':"mins if long_description LIKE 'Var%' else NULL",'out.var_weeks':"weeks if Var%, else 0",
'out.cont_mins':"mins if long_description LIKE 'Lect%' else NULL",'out.cont_weeks':"weeks if Lect%, else 0",
'sa.person_code':'DISTINCT staff in area @CL, session @SESS. INNER JOIN: other areas dropped.',
'sa.pam_area':'ut_people_staff_area.area','sa.prog':'ut_people_staff_area.area2','sa.pam_name':'organisation_units.fes_full_name on area',
'con.person_code':'One row per person. LEFT JOIN: staff with no contract kept.',
'con.weekly_hrs':'SUM(TRY_CONVERT(decimal(18,2), itr_contract_hours))','con.contract_start':'MIN(contract_startdate)',
'con.contract_type':"STRING_AGG(contract_type, ', ')",'con.contract_details':"STRING_AGG(CONCAT(type,' (',start,' - ',ISNULL(end,'Ongoing'),')'), '; ')",
'rem.hrs':'SUM(hrs) WHERE academicyear = @SESS','rem.person_code':'LEFT JOIN key',
'cadj.hrs':'SUM(TRY_CONVERT(decimal(18,2), hours))','cadj.person_code':'LEFT JOIN key',
'sl.staffname':"people.forename + ' ' + people.surname",'sl.progname':'organisation_units.fes_full_name joined on sa.prog',
'sl.starttime':'CONVERT(char(5), planned_start_date, 108)','sl.endtime':'CONVERT(char(5), planned_end_date, 108)',
'sl.day':'DATEPART / DATENAME(dw, planned_start_date)','sl.startdate':'MIN(planned_start_date) as date','sl.enddate':'MAX(planned_end_date) as date',
'sl.slot_mins':'DATEDIFF(mi, planned_start, planned_end) − break',
'sl.weeks':'COUNT(*) grouped by slot id, day, start/end time\n-- so COUNT = number of weeks',
'sl.is_cover':"long_description LIKE '%Cover%'",'sl.is_var':"long_description LIKE 'Var%'",'sl.is_lect':"long_description LIKE 'Lect%'",
'sl.var_weeks':"COUNT where long_description LIKE 'Var%'",'sl.cont_weeks':"COUNT where long_description LIKE 'Lect%'",
'red.person_function':"Weighting code ('1', '0.5', '0'). Filter: NOT IN ('LECT','INTERVIEW').",
'red.object_type':"Filter: = 'T'",'reds.object_type':"Filter: = 'T'",'reds.session_code':'Filter: = @SESS','red.session_code':'Filter: = @SESS',
'people.fes_staff_code':'Filter: IS NOT NULL','usa.area':'Filter: = @CL. Also gives pam_area.',
'itc.contract_type':"Filter: IN ('Lecturer','Management','VH Lecturer','Instructor','Technician'). Also listed in contract_type.",
'itc.active_contract':"Filter: = 'Y'",'itc.contract_enddate':'Filter: NULL or ≥ today','itc.session_code':'Filter: = @SESS',
'rmt.academicyear':'Filter: = @SESS','cat.academicyear':'Filter: = @SESS','usa.session_code':'Filter: = @SESS',
'pf.function_code':'Join key to red.person_function','re.id':'Join key to red.register_event_id'};
S.def='out.contract_type';

/* ================= engine ================= */
const VIEWS={'whole-college':W,'slot-detail':S};
let V,col,el,cur;
function NM(k){const [t,f]=k.split('.');return V.C.find(x=>x[0]==t)[1]+'.'+f;}
function anc(k,useF,set){(V.P[k]||[]).concat(useF?(V.F[k]||[]):[]).forEach(p=>{if(!set.has(p)){set.add(p);anc(p,useF,set);}});return set;}
function render(name){
  V=VIEWS[name]||W;col={};el={};cur=null;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v==(VIEWS[name]?name:'whole-college')));
  document.getElementById('intro').innerHTML=V.intro;
  const gr=document.getElementById('gr');
  gr.innerHTML='<div class="co" id="c0"><div class="ct">Source tables</div></div><div class="co" id="c1"><div class="ct">CTE steps</div></div><div class="co" id="c2"><div class="ct">Final output</div></div>';
  V.C.forEach(([id,nm,c,fs])=>{const cd=document.createElement('div');cd.className='cd';cd.innerHTML='<div class="hd">'+nm+'</div>';
    fs.forEach(f=>{const k=id+'.'+f,d=document.createElement('div');d.className='f';d.textContent=f;d.onclick=()=>sel(k);cd.appendChild(d);el[k]=d;col[k]=c;});
    document.getElementById('c'+c).appendChild(cd);});
  sel(V.def);
}
function sel(k){cur=k;const all=anc(k,true,new Set()),dat=anc(k,false,new Set());
  Object.entries(el).forEach(([key,d])=>{d.classList.toggle('sel',key==k);d.classList.toggle('anc',dat.has(key));d.classList.toggle('flt',all.has(key)&&!dat.has(key));});
  const leaves=[...dat].filter(x=>col[x]==0),fl=[...all].filter(x=>!dat.has(x)&&col[x]==0);
  const fx=(V.D[k]||'Join / filter column').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
  document.getElementById('pn').innerHTML='<h3>'+NM(k)+'</h3><div class="fx">'+fx+'</div>'+
  (leaves.length?'<div class="lb">Values from</div><div class="chips">'+leaves.map(x=>'<span class="chip">'+NM(x)+'</span>').join('')+'</div>':'')+
  (fl.length?'<div class="lb">Filtered by</div><div class="chips">'+fl.map(x=>'<span class="chip fl">'+NM(x)+'</span>').join('')+'</div>':'')+
  (!leaves.length&&!fl.length&&col[k]==0?'<div class="lb">Source column</div>':'');
  draw();}
function draw(){const w=document.getElementById('lw'),g=document.getElementById('eg'),ov=document.getElementById('ov'),wr=w.getBoundingClientRect();
  ov.setAttribute('width',w.scrollWidth);ov.setAttribute('height',w.scrollHeight);g.innerHTML='';if(!cur)return;
  const nodes=[cur,...anc(cur,true,new Set())];let s='';
  nodes.forEach(c=>{[[V.P[c]||[],0],[V.F[c]||[],1]].forEach(([ps,dash])=>ps.forEach(p=>{
    if(!el[p]||!el[c])return;
    const a=el[p].getBoundingClientRect(),b=el[c].getBoundingClientRect();
    const y1=a.top+a.height/2-wr.top,y2=b.top+b.height/2-wr.top;let d;
    if(col[p]<col[c]){const x1=a.right-wr.left,x2=b.left-wr.left-2,m=(x1+x2)/2;d=`M${x1} ${y1}C${m} ${y1},${m} ${y2},${x2} ${y2}`;}
    else{const x1=a.right-wr.left,x2=b.right-wr.left+2,cx=Math.max(x1,x2)+22;d=`M${x1} ${y1}C${cx} ${y1},${cx} ${y2},${x2} ${y2}`;}
    s+=`<path d="${d}" fill="none" stroke="currentColor" stroke-width="${dash?0.8:1.3}" opacity="${dash?0.5:0.85}" ${dash?'stroke-dasharray="4 3"':''} marker-end="url(#arrow)"/>`;}));});
  g.innerHTML=s;}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v;});
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));
new ResizeObserver(()=>draw()).observe(document.getElementById('lw'));
render(location.hash.slice(1)||'whole-college');
</script>
</body>
</html>
